name: Lint

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: ESLint
        run: npm run lint

      # vite build uses esbuild and does not type-check, so this is the only
      # gate that actually fails on a broken type.
      - name: Type check
        run: npm run typecheck

      # The README is the card's HACS landing page, not just developer docs.
      - name: Markdown
        run: npm run lint:md

      - name: Formatting
        run: npm run format:check
