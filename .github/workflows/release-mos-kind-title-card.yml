name: Release mos-kind-title-card

on:
  push:
    tags:
      - "mos-kind-title-card-v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build --workspace=packages/mos-kind-title-card

      - uses: softprops/action-gh-release@v2
        with:
          name: mos-kind-title-card ${{ github.ref_name }}
          generate_release_notes: true
          files: packages/mos-kind-title-card/dist/mos-kind-title-card.js
